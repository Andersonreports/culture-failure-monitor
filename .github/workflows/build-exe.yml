# Compiles the standalone dashboard into a single Windows .exe with Deno.
# - Every push to main (and manual runs) upload the exe as a downloadable
#   build artifact (Actions run -> Artifacts). Good for quick testing.
# - Pushing a version tag (e.g. v1.0.0) also attaches the exe to a GitHub
#   Release, giving a stable public download link to share with recipients.

name: Build exe

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile exe
        run: deno task build-standalone

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: culture-failure-dashboard
          path: dist/culture-failure-dashboard.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/culture-failure-dashboard.exe

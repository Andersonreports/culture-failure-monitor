name: Build Windows exe

# NOTE: server/credentials/*, server/data/* (Google OAuth client, token,
# login passwords) are gitignored and never reach this checkout — they exist
# only on your own machine. deno.json's build task embeds whatever's in
# those folders directly into the exe, so a CI-built exe embeds them empty
# and won't have working login or a Google Sheet connection. This workflow
# is useful to verify the code compiles; for a real distributable exe, run
# `powershell scripts\package.ps1` locally instead, where those files exist.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile exe
        run: deno task build

      - uses: actions/upload-artifact@v4
        with:
          name: culture-failure-monitor-windows
          path: dist/culture-failure-monitor.exe
